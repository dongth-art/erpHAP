<!-- UI_Header.html - HAP ERP SYSTEM -->
<div id="top-header">
  <div style="display: flex; align-items: center; gap: 16px;">
    <button class="toggle-sidebar-btn" onclick="toggleSidebar()" title="Ẩn/Hiện Sidebar">
      <svg class="svg-icon" viewBox="0 0 24 24">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>

    <div class="breadcrumb">
      <span id="breadcrumb-parent">Trang chủ</span>
      <span style="color: #cbd5e1;">/</span>
      <span id="breadcrumb-child" style="color: #0f172a; font-weight: 600;">Tổng quan</span>
    </div>
  </div>

  <div class="user-profile">
    <div class="user-avatar" id="header-user-avatar">A</div>
    <div style="text-align: left;">
      <div style="font-weight: 600; color: #0f172a; line-height: 1.2;" id="header-user-name">Admin HAP</div>
      <div style="font-size: 0.75rem; color: #64748b;" id="header-user-role">SuperAdmin</div>
    </div>
    
    <button class="btn-logout" onclick="handleLogout()" title="Đăng xuất khỏi hệ thống">
      <svg class="svg-icon" viewBox="0 0 24 24" style="width: 16px; height: 16px;">
        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
      </svg>
      <span>Thoát</span>
    </button>
  </div>
</div>

<script>
  function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    if (sidebar) {
      sidebar.classList.toggle('collapsed');
    }
  }
</script>
