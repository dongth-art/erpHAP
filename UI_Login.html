<!-- UI_Login.html - HAP HOLDING ERP SYSTEM -->
<div id="login-overlay" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #0f172a; z-index: 9999; display: flex; align-items: center; justify-content: center;">
  <div style="background: #ffffff; width: 390px; padding: 36px 32px; border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4); text-align: center;">
    
    <!-- LOGO CÔNG TY HAP HOLDING -->
    <div style="margin-bottom: 12px; display: flex; justify-content: center; align-items: center;">
      <img src="https://lh3.googleusercontent.com/d/1f4pu_IXo9UA_TQIBYbcsCBBdLESQCCkW" alt="HAP HOLDING Logo" style="max-height: 75px; object-fit: contain;">
    </div>

    <h2 style="color: #0f172a; font-size: 1.35rem; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.5px;">HAP HOLDING ERP</h2>
    <p style="color: #64748b; font-size: 0.85rem; margin-bottom: 24px;">Hệ Thống Quản Trị Doanh Nghiệp Tổng Thể</p>

    <div id="login-error-msg" style="display: none; background-color: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px; border-radius: 6px; font-size: 0.82rem; margin-bottom: 16px; text-align: left;"></div>

    <form onsubmit="handleLoginSubmit(event)">
      <div style="text-align: left; margin-bottom: 16px;">
        <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Tên đăng nhập</label>
        <input type="text" id="login-username" placeholder="Nhập username..." required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; transition: border 0.2s;" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'">
      </div>

<div style="text-align: left; margin-bottom: 24px;">
  <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #334155; margin-bottom: 6px;">Mật khẩu</label>
  <div style="position: relative;">
    <input type="password" id="login-password" placeholder="Nhập mật khẩu..." required style="width: 100%; padding: 10px 40px 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none; transition: border 0.2s;" onfocus="this.style.borderColor='#2563eb'" onblur="this.style.borderColor='#cbd5e1'">
    <button type="button" onclick="togglePasswordVisibility()" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; padding: 4px; color: #64748b;" id="btn-toggle-password" aria-label="Hiện/ẩn mật khẩu">
      <svg id="icon-eye" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    </button>
  </div>
</div>

      <button type="submit" id="btn-login-submit" style="width: 100%; background-color: #2563eb; color: #ffffff; border: none; padding: 12px; border-radius: 6px; font-size: 0.92rem; font-weight: 600; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <span>ĐĂNG NHẬP</span>
      </button>
    </form>
  </div>
</div>

<script>
  function togglePasswordVisibility() {
    const pwd = document.getElementById('login-password');
    const icon = document.getElementById('icon-eye');
    if (pwd.type === 'password') {
      pwd.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
    } else {
      pwd.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
  }

  function handleLoginSubmit(event) {
    event.preventDefault();
    
    const uName = document.getElementById('login-username').value.trim();
    const pWord = document.getElementById('login-password').value.trim();
    const btnSubmit = document.getElementById('btn-login-submit');
    const errBox = document.getElementById('login-error-msg');

    errBox.style.display = 'none';
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<svg class="login-spinner" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10" stroke-dasharray="60 20" stroke-dashoffset="0"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></circle></svg><span>Đang kiểm tra...</span>';

    google.script.run
      .withSuccessHandler(function(res) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>ĐĂNG NHẬP</span>';

        if (res && res.success) {
          // Lưu thông tin hiển thị + token phiên do server cấp
          localStorage.setItem('HAP_USER_SESSION', JSON.stringify(Object.assign({}, res.user, { token: res.token })));
          window.HAP_LOGIN_JUST_DONE = true;
          setTimeout(function(){ window.HAP_LOGIN_JUST_DONE = false; }, 3000);
          updateUserHeaderUI(res.user);
          document.getElementById('login-overlay').style.display = 'none';
          
          // Chuyển ngay sang trang Dashboard mặc định khi đăng nhập thành công
          switchView('view-dashboard', 'HAP HOLDING', 'Trang tổng quan');
          if (typeof HAP_onAuthenticated === 'function') HAP_onAuthenticated();
        } else {
          errBox.textContent = res ? res.message : 'Lỗi xác thực';
          errBox.style.display = 'block';
        }
      })
      .withFailureHandler(function(err) {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>ĐĂNG NHẬP</span>';
        errBox.textContent = 'Lỗi kết nối máy chủ: ' + err.toString();
        errBox.style.display = 'block';
      })
      .verifyLogin(uName, pWord);
  }
</script>
